name: Extract release workspace

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09c86-muslio
    paths:
      - ".github/workflows/extract-release.yml"

permissions:
  contents: write

concurrency:
  group: extract-release
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a09c86-muslio
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p /tmp/muslio-release
          gh release download Release --repo shiprzq/Muslio --dir /tmp/muslio-release
          ls -lh /tmp/muslio-release
          unzip -l /tmp/muslio-release/*.zip | sed -n '1,250p'

      - name: Extract and copy project files
        run: |
          set -eu
          EXTRACT=/tmp/muslio-extracted
          mkdir -p "$EXTRACT"
          unzip -q /tmp/muslio-release/*.zip -d "$EXTRACT"
          {
            echo "## Extracted tree"
            echo '```'
            find "$EXTRACT" -maxdepth 3 \( -name node_modules -o -name .git -o -name .venv -o -name venv -o -name .next \) -prune -o -print | sed -n '1,400p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Top-level entries:"
          ls -la "$EXTRACT"
          if [ "$(ls -A "$EXTRACT" | wc -l)" -eq 1 ]; then
            inner="$EXTRACT/$(ls -A "$EXTRACT")"
            if [ -d "$inner" ]; then
              echo "Using nested directory: $inner"
              SRC="$inner"
            else
              SRC="$EXTRACT"
            fi
          else
            SRC="$EXTRACT"
          fi
          echo "SRC=$SRC"
          ls -la "$SRC"

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/extract-release.yml' \
            --exclude 'node_modules/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '.next/' \
            --exclude '.nuxt/' \
            --exclude '.output/' \
            --exclude '.turbo/' \
            --exclude '.cache/' \
            --exclude '.arena/' \
            --exclude '.DS_Store' \
            --exclude '.env' \
            --exclude '.env.local' \
            "$SRC"/ ./

          find . -type f -size +90M -not -path './.git/*' -print -delete || true

          if [ ! -f .gitignore ]; then
            touch .gitignore
          fi
          python3 -c '
          from pathlib import Path
          p = Path(".gitignore")
          existing = p.read_text() if p.exists() else ""
          extras = [
            "node_modules/",
            ".venv/",
            "venv/",
            "__pycache__/",
            ".pytest_cache/",
            ".mypy_cache/",
            ".ruff_cache/",
            ".next/",
            ".nuxt/",
            ".output/",
            ".turbo/",
            ".cache/",
            ".parcel-cache/",
            "coverage/",
            ".arena/",
            ".DS_Store",
            "*.pyc",
            ".env",
            ".env.local",
            ".env.*.local",
          ]
          lines = existing.splitlines()
          for e in extras:
              if e not in lines:
                  lines.append(e)
          p.write_text("\n".join(lines).rstrip() + "\n")
          '

          echo "Workspace after copy:"
          ls -la
          {
            echo "## Workspace after copy"
            echo '```'
            find . -maxdepth 3 \( -path './.git' -o -name node_modules \) -prune -o -print | sed -n '1,300p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit extracted project
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git status --short | sed -n '1,80p'
          git commit -m "Extract Muslio workspace from GitHub Release"
          git pull --rebase origin arena/01a09c86-muslio || true
          git push origin arena/01a09c86-muslio
